#---------------------------------------------------------------------------
# Terminal: true color + italics. Requires `tmux-256color` terminfo entry
# (ships with macOS Sequoia ncurses; otherwise see `man terminfo`).
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB,ghostty:RGB"
#---------------------------------------------------------------------------
set -g history-limit 20000
set -g status-style "bg=colour234"
set -g window-status-activity-style "bold"
set -g message-style "fg=colour16,bg=colour221,bold"
#---------------------------------------------------------------------------
# Renumber windows
set -g renumber-windows on
#---------------------------------------------------------------------------
# Use Ctrl-T for (CTRL TMUX) as prefix
unbind C-b
set -g prefix C-t
bind C-t send-prefix
#---------------------------------------------------------------------------
# Activity Monitoring
setw -g monitor-activity off
set -g visual-activity off
#---------------------------------------------------------------------------
# Constrain window size to the maximum size of any client connected to
# *that window* rather than the whole session.
setw -g aggressive-resize on
#---------------------------------------------------------------------------
# Make delay shorter
set -sg escape-time 0
#---------------------------------------------------------------------------
# Tile all windows
unbind =
bind = select-layout tiled
#---------------------------------------------------------------------------
set -g set-titles on
set -g set-titles-string "#T - #W"
#---------------------------------------------------------------------------
# Key bindings
#---------------------------------------------------------------------------
# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"
# Quickly open a new window
bind N new-window
#---------------------------------------------------------------------------
# Split window keeping current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
#---------------------------------------------------------------------------
# Synchronize all panes in a window
bind y setw synchronize-panes
#---------------------------------------------------------------------------
# Pane movement (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
#---------------------------------------------------------------------------
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+
#---------------------------------------------------------------------------
# Resize pane shortcuts
bind -r H resize-pane -L 10
bind -r J resize-pane -D 10
bind -r K resize-pane -U 10
bind -r L resize-pane -R 10
#---------------------------------------------------------------------------
# Mouse + vi copy mode
setw -g mouse on
setw -g mode-keys vi

unbind [
unbind p
bind v copy-mode
bind Escape copy-mode
bind p paste-buffer

# Vim-like selection and copy to macOS clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
#---------------------------------------------------------------------------
source ~/.dotfiles/shell/tmux/theme.sh
#---------------------------------------------------------------------------
# Plugins (TPM is installed as a dotfiles submodule and symlinked here).
# Plugin dir + resurrect saves live under $XDG_DATA_HOME/tmux/.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$XDG_DATA_HOME/tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-dir "$XDG_DATA_HOME/tmux/resurrect"

run '$XDG_DATA_HOME/tmux/plugins/tpm/tpm'
