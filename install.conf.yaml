- defaults:
    link:
      relink: true
      create: true

- clean: ['~']

- create:
    - ~/.tmux/resurrect

- link:
    ~/.zshenv: shell/zshenv
    ~/.zshrc: shell/zshrc
    ~/.tmux.conf: shell/tmux/tmux.conf
    ~/.tmux/plugins/tpm: tpm
    ~/.config/sheldon/plugins.toml: shell/sheldon/plugins.toml
    ~/.config/starship.toml: shell/starship/starship.toml
    ~/.vim: shell/vim
    ~/.vimrc: shell/vim/config.vim
    ~/.config/nvim: shell/nvim
    ~/.gitconfig: shell/git/gitconfig
    ~/.gitignore: shell/git/gitignore
    ~/.config/mise/config.toml: shell/mise/config.toml
    ~/.claude/CLAUDE.md: claude/CLAUDE.md
    "~/Library/Application Support/Sublime Text/Packages/User/Preferences.sublime-settings":
        path: shell/sublime/Preferences.sublime-settings
        force: true

- shell:
  - command: command -v brew >/dev/null && brew bundle --file=Brewfile || echo "skipped — install Homebrew first (https://brew.sh), then re-run"
    description: Installing Homebrew packages from Brewfile
    stdout: true
  - [git submodule update --init --recursive, Installing submodules]
  - [~/.tmux/plugins/tpm/bin/install_plugins, Installing tmux plugins]
  - command: command -v sheldon >/dev/null && sheldon lock || echo "skipped — sheldon not installed (brew bundle should have installed it)"
    description: Locking sheldon plugins
    stdout: true
  - command: 'chmod -R go-w /opt/homebrew/share/zsh /opt/homebrew/share/zsh-completions 2>/dev/null; true'
    description: Tightening permissions on zsh completion dirs (silences compinit warning)
  - command: |
      defaults write com.googlecode.iterm2 PrefsCustomFolder -string "$HOME/.dotfiles/shell/iterm2"
      defaults write com.googlecode.iterm2 LoadPrefsFromCustomFolder -bool true
      defaults write com.googlecode.iterm2 NoSyncNeverRemindPrefsChangesLostForFile -bool true
      plutil -convert xml1 "$HOME/.dotfiles/shell/iterm2/com.googlecode.iterm2.plist" 2>/dev/null || true
    description: Pointing iTerm2 at dotfiles preferences (restart iTerm2 to apply)
